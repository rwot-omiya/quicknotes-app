<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>QuickNotes</h1>
      <p>Capture your thoughts, tasks and ideas in one simple place.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel" aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Your note</label>
          <input id="note-input" name="note" type="text" placeholder="What do you want to remember?" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" class="error-message" role="alert"></p>
    </section>

    <section class="panel" aria-labelledby="your-notes-heading">
      <h2 id="your-notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input id="search-input" type="search" placeholder="Search by note text..." autocomplete="off">
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
